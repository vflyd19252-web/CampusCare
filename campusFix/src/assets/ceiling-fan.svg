<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="ceilingLight" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f5f5f7"/>
      <stop offset="100%" stop-color="#d1d5db"/>
    </radialGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3d28"/>
      <stop offset="50%" stop-color="#3d2817"/>
      <stop offset="100%" stop-color="#24160c"/>
    </linearGradient>
    <filter id="fanShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="12" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ceiling background -->
  <rect width="600" height="400" fill="url(#ceilingLight)"/>

  <!-- Ceiling Mount / Rod -->
  <g filter="url(#fanShadow)">
    <!-- Fan Rod -->
    <rect x="294" y="90" width="12" height="70" rx="3" fill="#3d2817"/>
    <!-- Canopy -->
    <ellipse cx="300" cy="90" rx="28" ry="12" fill="#5a3d28"/>

    <!-- Blade 1 (Pointing Bottom Left) -->
    <path d="M 285 220 L 110 320 Q 95 330 110 342 L 135 348 Q 150 348 295 240 Z" fill="url(#bladeGrad)"/>
    
    <!-- Blade 2 (Pointing Top Right) -->
    <path d="M 315 210 L 490 120 Q 510 110 495 98 L 470 92 Q 455 92 305 195 Z" fill="url(#bladeGrad)"/>

    <!-- Blade 3 (Pointing Bottom Right) -->
    <path d="M 315 225 L 480 325 Q 498 335 485 348 L 460 354 Q 442 352 300 245 Z" fill="url(#bladeGrad)"/>

    <!-- Center Motor Housing -->
    <circle cx="300" cy="220" r="32" fill="#3d2817" stroke="#24160c" stroke-width="3"/>
    <circle cx="300" cy="220" r="22" fill="#5a3d28"/>
    <circle cx="300" cy="220" r="10" fill="#caa065"/>
  </g>
</svg>